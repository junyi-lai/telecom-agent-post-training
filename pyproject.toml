[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-agent-post-training"
version = "0.1.0"
description = "Failure-aware post-training for tau2-bench telecom agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = [
    "tau2[gym]",
    "httpx>=0.27",
    "pydantic>=2.12",
    "PyYAML>=6.0.2",
    "pandas>=2.2.3",
    "pyarrow>=18",
]

[project.optional-dependencies]
collect = [
    "vllm==0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.9.1",
]

[tool.uv.sources]
tau2 = { path = "third_party/tau2-bench", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "tmp/pytest_cache"
markers = [
    "live_api: calls a paid model API",
]

[tool.ruff]
line-length = 88
target-version = "py312"
cache-dir = "tmp/ruff_cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]
