<g font-size="14" font-weight="700" fill="#138075"><text x="68" y="159">01 / BASELINE</text><text x="356" y="159">02 / DIAGNOSE</text><text x="644" y="159">03 / TEACHER</text><text x="932" y="159">04 / DATASET</text></g>
<g font-size="22" font-weight="700"><text x="68" y="199">164 任务 × 4 次</text><text x="356" y="199">定位多轮失败</text><text x="644" y="199">教师重新执行</text><text x="932" y="199">388 条成功候选</text></g>
<g font-size="16" fill="#5c6b70"><text x="68" y="235">收集 656 条交互轨迹</text><text x="356" y="235">状态不全 / 工具 / 重复</text><text x="644" y="235">通过环境断言才保留</text><text x="932" y="235">原生成功 + 纠错示范</text></g>
