<text x="48" y="56" font-size="28" font-weight="700">把失败转化为可核验的训练数据</text><text x="48" y="88" font-size="16" fill="#5c6b70">基线采集 → 失败诊断 → 教师纠错 → SFT → GRPO → 冻结评测</text>
