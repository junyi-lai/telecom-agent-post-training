arm: uniform
description: Cover every training task, then add stable-random second rows.
dataset: results/data/processed/sft/sft_uniform.jsonl
budget:
  assistant_tokens: 160000
  optimizer_steps: 75
sampling:
  first_pass: one_success_per_required_task
  second_pass: stable_random
  required_task_count: 164
  max_examples_per_task: 2
  deduplicate_exact_message_trajectories: true
rl_prompts:
  unique_task_coverage: 164
  rows: 164
  repeats_per_task: 1
